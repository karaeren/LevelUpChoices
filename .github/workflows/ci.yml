name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: ga
          skip-lts-prepass: true
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet

      - name: Check formatting
        run: ./format.ps1 --check

      - name: Build Release
        run: dotnet build LevelUpChoices.sln --configuration Release --no-restore
